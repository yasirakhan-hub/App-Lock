name: Build AppLock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore permanent signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          # Strip whitespace and line breaks before decoding to prevent EOFException from premature truncation
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/smart-applock-release.jks"
          chmod 600 "$RUNNER_TEMP/smart-applock-release.jks"

          if [ ! -s "$RUNNER_TEMP/smart-applock-release.jks" ]; then
            echo "ERROR: Keystore restoration failed. Restored file is empty."
            exit 1
          fi

      - name: Safe keystore diagnostics
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/smart-applock-release.jks"
          echo "Keystore file details:"
          ls -l "$KEYSTORE_FILE"
          echo "Keystore SHA-256 hash:"
          sha256sum "$KEYSTORE_FILE"

      - name: Verify permanent signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'smart-applock' }}
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$RUNNER_TEMP/smart-applock-release.jks"
          TARGET_ALIAS="${KEY_ALIAS:-smart-applock}"

          echo "Verifying keystore integrity and alias '${TARGET_ALIAS}'..."

          STORE_PASS_ENV=""
          if [ -n "${KEYSTORE_PASSWORD:-}" ] && keytool -list -keystore "$KEYSTORE_FILE" -storepass:env KEYSTORE_PASSWORD -alias "$TARGET_ALIAS" > /dev/null 2>&1; then
            STORE_PASS_ENV="KEYSTORE_PASSWORD"
          elif [ -n "${KEY_PASSWORD:-}" ] && keytool -list -keystore "$KEYSTORE_FILE" -storepass:env KEY_PASSWORD -alias "$TARGET_ALIAS" > /dev/null 2>&1; then
            STORE_PASS_ENV="KEY_PASSWORD"
          fi

          if [ -n "$STORE_PASS_ENV" ]; then
            echo "Keystore password verified using environment variable: ${STORE_PASS_ENV}."
            keytool -list -keystore "$KEYSTORE_FILE" -storepass:env "$STORE_PASS_ENV" -alias "$TARGET_ALIAS"
          else
            echo "Keystore verification failed. Testing primary password with diagnostics output:"
            if [ -n "${KEYSTORE_PASSWORD:-}" ]; then
              keytool -list -keystore "$KEYSTORE_FILE" -storepass:env KEYSTORE_PASSWORD -alias "$TARGET_ALIAS" || true
            elif [ -n "${KEY_PASSWORD:-}" ]; then
              keytool -list -keystore "$KEYSTORE_FILE" -storepass:env KEY_PASSWORD -alias "$TARGET_ALIAS" || true
            else
              echo "ERROR: Neither KEYSTORE_PASSWORD nor KEY_PASSWORD secret is configured."
            fi
            exit 1
          fi

          echo "Keystore validation succeeded: Key alias '${TARGET_ALIAS}' verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/smart-applock-release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'smart-applock' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$STORE_PASSWORD" || { echo "ERROR: Missing STORE_PASSWORD / KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: Missing KEY_PASSWORD"; exit 1; }

          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-AppLock-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/smart-applock-release.jks"
